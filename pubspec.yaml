name: signal_hunter
description: Radar de señales Wi-Fi y Bluetooth con mapa, sensores y segundo plano
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  wifi_scan: ^0.4.1
  flutter_blue_plus: ^1.35.0
  geolocator: ^10.1.0
  geolocator_android: any
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.4
  flutter_local_notifications: ^19.0.0
  http: any
  sensors_plus: ^6.1.0
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true